name: Update Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README metrics
    runs-on: ubuntu-latest
    steps:
      # WakaTime builds the weekly aggregate lazily. Without this warm-up the
      # first consumer can read an aggregate with empty breakdown lists, which
      # is how the README ended up printing "No Activity Tracked This Week"
      # while the account had 20+ hours of AI Coding time.
      - name: Warm up WakaTime weekly aggregate
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -u "$WAKATIME_API_KEY:" \
              "https://wakatime.com/api/v1/users/current/stats/last_7_days")
            echo "attempt $attempt -> HTTP $status"
            [ "$status" = "200" ] && break
            sleep 15
          done
          sleep 20

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
          COMMIT_MESSAGE: "docs(profile): update WakaTime stats"
          SHOW_TIMEZONE: false
          SHOW_TOTAL_CODE_TIME: true
          SHOW_PROFILE_VIEWS: false
          SHOW_SHORT_INFO: false
          SHOW_LOC_CHART: false
          SHOW_LINES_OF_CODE: false
          SHOW_PROJECTS: false
          SHOW_LANGUAGE_PER_REPO: false
          SHOW_COMMIT: false
          SHOW_DAYS_OF_WEEK: false
          SHOW_EDITORS: true
          SHOW_OS: true
          SHOW_LANGUAGE: true
          # Both AI features of the action stay off:
          #   SHOW_AI_CODE_TIME reads the AI Coding category from
          #     stats/all_time, which WakaTime has not backfilled — it reported
          #     6h29m all-time against 24h30m in the last 7 days alone.
          #   SHOW_AI_CODING always prints a retail-equivalent cost estimate
          #     with no flag to suppress it.
          # profile_metrics.py renders both from stats/last_7_days instead.
          SHOW_AI_CODE_TIME: false
          SHOW_AI_CODING: false
          SYMBOL_VERSION: 3

      - name: Check out README updated by the action
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test metric rendering
        run: python .github/scripts/test_profile_metrics.py

      - name: Render agent and delivery metrics
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          # time_split stays unpublished until this variable is set to true.
          # The credentials below remain configured so enabling it needs no
          # second authorization round.
          PUBLISH_TIME_SPLIT: ${{ vars.PUBLISH_TIME_SPLIT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_EMAIL: ${{ secrets.GOOGLE_CALENDAR_EMAIL }}
        run: python .github/scripts/profile_metrics.py

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No metric changes"
            exit 0
          fi
          git add README.md
          git commit -m "docs(profile): update agent and delivery metrics"
          git push
